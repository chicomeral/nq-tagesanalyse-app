<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NQ Tagesanalyse">
<title>NQ Tagesanalyse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html,body{margin:0;height:100%;background:#0c0c0d;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0c0c0d}
#hilfe{position:fixed;left:0;right:0;bottom:0;padding:12px;text-align:center;font:14px system-ui,sans-serif;color:#cfd6e0;background:#0e1117ee;border-top:1px solid #2a313c;display:none;z-index:2}
#hilfe a{color:#26c978;font-weight:600;text-decoration:none;margin:0 6px}
#hilfe b{display:block;margin-bottom:6px}
</style></head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbyJWofcV1njqNMijq6kcTVdFrVHqXVSZ6ENomobgogZUVcGrxvAyEM2XwxHH0Bv5rJu/exec" allow="clipboard-read *; clipboard-write *; fullscreen; microphone; camera" allowfullscreen></iframe>
<div id="hilfe"><b>Leer oder Fehlermeldung? Einmal bei Google anmelden:</b>
<a href="https://script.google.com/macros/s/AKfycbyJWofcV1njqNMijq6kcTVdFrVHqXVSZ6ENomobgogZUVcGrxvAyEM2XwxHH0Bv5rJu/exec" target="_blank" rel="noopener">Bei Google anmelden ↗</a> · <a href="#" id="reload">Neu laden</a> · <a href="#" id="zu">Ausblenden</a></div>
<script>
var h=document.getElementById('hilfe');
// Hilfe kurz zeigen; blendet sich selbst wieder aus
setTimeout(function(){h.style.display='block'},6000);
setTimeout(function(){h.style.display='none'},20000);
document.getElementById('reload').onclick=function(){location.reload();return false};
document.getElementById('zu').onclick=function(){h.style.display='none';return false};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
